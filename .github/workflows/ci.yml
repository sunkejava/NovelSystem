name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build backend
        run: dotnet build src/backend/NovelSystem.sln -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package.json
      - name: Install frontend
        working-directory: src/frontend
        run: npm install
      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
